<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse Atlas</title>
<meta name="description" content="Атлас мистецтва й архітектури: люди, твори, місця та зв'язки між ними.">
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/cytoscape.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">Muse Atlas</a>
  <nav class="views" aria-label="Views">
    <button type="button" aria-current="page" data-view="graph"></button>
    <button type="button" disabled data-view="timeline"></button>
    <button type="button" disabled data-view="map"></button>
    <button type="button" disabled data-view="quiz"></button>
  </nav>
  <div class="search" role="search">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-controls="results" aria-expanded="false">
    <ul id="results" class="results" hidden></ul>
  </div>
  <div class="seg theme" role="group">
    <button type="button" data-theme-set="auto"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button type="button" data-theme-set="light"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button type="button" data-theme-set="dark"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
  <div class="seg lang" role="group" aria-label="Мова / Language">
    <button type="button" data-lang-set="uk">УКР</button>
    <button type="button" data-lang-set="en">EN</button>
  </div>
</header>

<main class="layout">
  <nav id="shelf" class="shelf"></nav>
  <section class="graph-wrap" aria-label="Graph">
    <div id="filters" class="filters"></div>
    <div id="cy"></div>
    <div id="loading" class="loading"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="zoom">
      <button type="button" data-zoom="in">+</button>
      <button type="button" data-zoom="out">−</button>
      <button type="button" data-zoom="fit">⤢</button>
    </div>
  </section>
  <aside id="panel" class="panel" hidden></aside>
</main>
</body>
</html>
